<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskMyNotes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg:          #0e0f11;
        --surface:     #16181c;
        --border:      #2a2d33;
        --accent:      #e8c97e;
        --accent-dim:  #b89a55;
        --text:        #e8e6e1;
        --muted:       #6b7280;
        --radius:      10px;
        --mono:        'DM Mono', monospace;
        --sans:        'DM Sans', sans-serif;
        --serif:       'DM Serif Display', serif;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html { font-size: 16px; }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-weight: 300;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
        opacity: .5;
      }

      /* ── Header ── */
      header {
        position: relative;
        z-index: 1;
        padding: 3rem 2rem 2.5rem;
        border-bottom: 1px solid var(--border);
        text-align: center;
        background: linear-gradient(180deg, #111318 0%, transparent 100%);
      }

      header h1 {
        font-family: var(--serif);
        font-size: clamp(2.4rem, 5vw, 3.8rem);
        letter-spacing: -.02em;
        color: var(--accent);
        line-height: 1;
        margin-bottom: .6rem;
      }

      header p {
        font-size: .95rem;
        color: var(--muted);
        letter-spacing: .04em;
        font-family: var(--mono);
      }

      /* ── Main ── */
      main {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 680px;
        margin: 0 auto;
        padding: 3rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      main section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.75rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        transition: border-color .2s;
      }

      main section:focus-within {
        border-color: var(--accent-dim);
      }

      /* ── Labels ── */
      label {
        font-size: .78rem;
        font-family: var(--mono);
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* ── File input ── */
      input[type="file"] {
        font-family: var(--mono);
        font-size: .85rem;
        color: var(--text);
        background: var(--bg);
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        padding: .9rem 1rem;
        cursor: pointer;
        width: 100%;
        transition: border-color .2s, background .2s;
      }

      input[type="file"]:hover {
        border-color: var(--accent-dim);
        background: #131519;
      }

      input[type="file"]::file-selector-button {
        font-family: var(--mono);
        font-size: .78rem;
        background: var(--accent);
        color: #0e0f11;
        border: none;
        border-radius: 6px;
        padding: .35rem .9rem;
        cursor: pointer;
        margin-right: 1rem;
        font-weight: 500;
        transition: background .2s;
      }

      input[type="file"]::file-selector-button:hover {
        background: #f0d690;
      }

      #upload-status {
        font-family: var(--mono);
        font-size: .8rem;
        color: var(--muted);
        min-height: 1.1em;
      }

      /* ── Textarea ── */
      textarea {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: .9rem 1rem;
        font-family: var(--sans);
        font-size: .95rem;
        font-weight: 300;
        resize: vertical;
        width: 100%;
        line-height: 1.6;
        transition: border-color .2s;
        outline: none;
      }

      textarea:focus { border-color: var(--accent-dim); }

      textarea::placeholder {
        color: var(--muted);
        font-style: italic;
      }

      /* ── Button ── */
      button#ask-btn {
        align-self: flex-start;
        background: var(--accent);
        color: #0e0f11;
        border: none;
        border-radius: var(--radius);
        padding: .65rem 1.8rem;
        font-family: var(--mono);
        font-size: .85rem;
        font-weight: 500;
        letter-spacing: .06em;
        cursor: pointer;
        transition: background .2s, transform .1s;
      }

      button#ask-btn:hover  { background: #f0d690; }
      button#ask-btn:active { transform: scale(.97); }

      button#ask-btn:disabled {
        background: var(--border);
        color: var(--muted);
        cursor: not-allowed;
        transform: none;
      }

      #status {
        font-family: var(--mono);
        font-size: .8rem;
        color: var(--muted);
        min-height: 1.1em;
      }

      /* ── Answer panel ── */
      #answer {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      #answer[hidden] { display: none; }

      #answer-section h2 {
        font-family: var(--serif);
        font-size: 1.5rem;
        color: var(--accent);
        letter-spacing: -.01em;
      }

      #qtype-pill,
      #tool-pill {
        display: inline-block;
        font-family: var(--mono);
        font-size: .72rem;
        letter-spacing: .08em;
        text-transform: uppercase;
        background: #1e2026;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: .25rem .85rem;
        color: var(--accent-dim);
        width: fit-content;
      }

      #qtype-pill[hidden],
      #tool-pill[hidden] { display: none; }

      #answer-text {
        font-size: 1rem;
        line-height: 1.75;
        color: var(--text);
      }

      /* ── Sources ── */
      details#sources {
        border-top: 1px solid var(--border);
        padding-top: 1rem;
        margin-top: .25rem;
      }

      details#sources[hidden] { display: none; }

      details#sources summary {
        font-family: var(--mono);
        font-size: .8rem;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
        list-style: none;
        display: flex;
        align-items: center;
        gap: .5rem;
      }

      details#sources summary::before {
        content: '▶';
        font-size: .6rem;
        transition: transform .2s;
      }

      details[open] summary::before { transform: rotate(90deg); }

      #sources-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: .5rem;
        margin-top: .85rem;
        padding-left: .5rem;
      }

      #sources-list li {
        font-size: .85rem;
        color: var(--muted);
        font-family: var(--mono);
        border-left: 2px solid var(--accent-dim);
        padding-left: .75rem;
        line-height: 1.5;
      }

      /* ── Footer ── */
      footer {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 1.5rem;
        border-top: 1px solid var(--border);
      }

      footer p {
        font-family: var(--mono);
        font-size: .75rem;
        color: var(--muted);
        letter-spacing: .06em;
      }

      @media (max-width: 480px) {
        header { padding: 2rem 1.25rem 1.75rem; }
        main   { padding: 2rem 1rem; }
        main section { padding: 1.25rem; }
      }
    </style>
  </head>
  <body>

    <header>
      <h1>AskMyNotes</h1>
      <p>Upload a PDF. Ask a question. Get a grounded answer.</p>
    </header>

    <main>

      <section>
        <label for="pdf-input">Upload your notes (PDF)</label>
        <input type="file" id="pdf-input" accept="application/pdf">
        <p id="upload-status"></p>
      </section>

      <section>
        <label for="question">Your question</label>
        <textarea id="question" rows="3" placeholder="Type your question here..."></textarea>
        <button id="ask-btn" type="button">Submit</button>
        <p id="status"></p>
      </section>

      <section id="answer-section">
        <h2>Answer</h2>
        <div id="answer">
          <p id="qtype-pill" hidden></p>
          <p id="tool-pill" hidden></p>
          <p id="answer-text">Your answer will appear here after you submit a question.</p>
          <details id="sources" hidden>
            <summary>Sources</summary>
            <ul id="sources-list"></ul>
          </details>
        </div>
      </section>

    </main>

    <footer>
      <p>Built in the AI Engineering Bootcamp.</p>
    </footer>

    <script src="app.js" defer></script>

  </body>
</html>
