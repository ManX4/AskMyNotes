<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AskMyNotes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #e8a94d;
      --gold-dim: #c4863a;
      --gold-glow: rgba(232, 169, 77, 0.18);
      --navy: #0b1120;
      --surface: #111827;
      --surface-2: #1a2540;
      --border: rgba(255,255,255,0.07);
      --border-gold: rgba(232, 169, 77, 0.3);
      --text-primary: #f0ece3;
      --text-muted: #7a8499;
      --text-dim: #4a5568;
      --accent-blue: #4a9eff;
      --radius: 14px;
      --transition: 0.22s ease;
    }

    html { font-size: 16px; }

    body {
      background-color: var(--navy);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(232, 169, 77, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(74, 158, 255, 0.04) 0%, transparent 50%),
        url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='0.8' fill='%23ffffff' opacity='0.025'/%3E%3C/svg%3E");
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.25rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-primary);
    }

    /* ── Ambient orbs ── */
    body::before {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,169,77,0.05) 0%, transparent 70%);
      top: -200px; left: -200px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(74,158,255,0.05) 0%, transparent 70%);
      bottom: -150px; right: -150px;
      pointer-events: none;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 620px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.75rem 2.5rem;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.6s ease both;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,169,77,0.5), transparent);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.6s 0.1s ease both;
    }
    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      margin-bottom: 1.25rem;
      position: relative;
    }
    .logo-mark svg { width: 26px; height: 26px; }
    .logo-mark::after {
      content: '';
      position: absolute; inset: -4px;
      border-radius: 18px;
      background: var(--gold-glow);
      z-index: -1;
    }
    .site-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .site-title span { color: var(--gold); font-style: italic; }
    .site-sub {
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 0 2rem;
    }

    /* ── Section label ── */
    .field-group { margin-bottom: 1.5rem; animation: fadeUp 0.6s 0.2s ease both; }
    .field-group:last-of-type { margin-bottom: 0; }
    .field-group + .field-group { animation-delay: 0.25s; }
    .field-group:nth-child(3) { animation-delay: 0.3s; }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }

    /* ── File input ── */
    .file-drop {
      border: 1px dashed var(--border-gold);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
      position: relative;
      background: rgba(232,169,77,0.02);
    }
    .file-drop:hover { background: rgba(232,169,77,0.06); border-color: var(--gold); }
    .file-drop input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .file-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      background: rgba(232,169,77,0.12);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .file-icon svg { width: 20px; height: 20px; color: var(--gold); }
    .file-info { flex: 1; min-width: 0; }
    .file-main { font-size: 0.85rem; font-weight: 500; color: var(--text-primary); }
    .file-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    #upload-status {
      font-size: 0.73rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      padding-left: 2px;
    }
    #upload-status.has-file { color: var(--gold); }

    /* ── Textarea ── */
    textarea {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.88rem;
      color: var(--text-primary);
      resize: none;
      outline: none;
      line-height: 1.65;
      transition: border-color var(--transition), background var(--transition);
      min-height: 100px;
    }
    textarea::placeholder { color: var(--text-dim); }
    textarea:focus {
      border-color: var(--border-gold);
      background: rgba(26, 37, 64, 0.8);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }

    /* ── Submit row ── */
    .submit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.75rem;
      gap: 1rem;
    }
    #status { font-size: 0.73rem; color: var(--text-muted); flex: 1; }

    button#ask-btn {
      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      color: #1a1000;
      border: none;
      border-radius: 10px;
      padding: 0.65rem 1.5rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.83rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
      white-space: nowrap;
      position: relative;
      overflow: hidden;
    }
    button#ask-btn::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      border-radius: inherit;
    }
    button#ask-btn:hover { opacity: 0.9; box-shadow: 0 4px 20px rgba(232,169,77,0.35); }
    button#ask-btn:active { transform: scale(0.97); }

    /* ── Answer ── */
    .answer-wrap { animation: fadeUp 0.6s 0.35s ease both; }

    .pills { display: flex; gap: 6px; margin-bottom: 0.6rem; flex-wrap: wrap; }
    .pill {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-gold);
      color: var(--gold);
      background: rgba(232,169,77,0.08);
    }
    .pill.hidden { display: none; }

    #answer {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem 1.25rem;
      min-height: 110px;
      position: relative;
      transition: border-color var(--transition);
    }
    #answer.has-content { border-color: rgba(255,255,255,0.1); }

    #answer-text {
      font-size: 0.88rem;
      line-height: 1.75;
      color: var(--text-muted);
      font-style: italic;
    }
    #answer-text.answered {
      color: var(--text-primary);
      font-style: normal;
    }

    /* ── Sources ── */
    details#sources-wrap {
      margin-top: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    details#sources-wrap.hidden { display: none; }
    details#sources-wrap summary {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--text-muted);
      padding: 0.7rem 1rem;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface-2);
      transition: color var(--transition);
    }
    details#sources-wrap summary:hover { color: var(--gold); }
    details#sources-wrap summary::before {
      content: '▸';
      font-size: 0.7rem;
      transition: transform 0.15s ease;
      display: inline-block;
    }
    details[open]#sources-wrap summary::before { transform: rotate(90deg); }
    details#sources-wrap summary::-webkit-details-marker { display: none; }

    #sources {
      list-style: none;
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: var(--surface);
    }
    #sources li {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.55;
      padding-left: 1.25rem;
      position: relative;
    }
    #sources li::before {
      content: counter(list-item);
      position: absolute; left: 0;
      color: var(--gold);
      font-weight: 600;
      font-size: 0.68rem;
    }
    #sources { counter-reset: list-item; }
    #sources li { counter-increment: list-item; }

    /* ── Footer ── */
    footer {
      margin-top: 1.75rem;
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      animation: fadeUp 0.6s 0.5s ease both;
    }
    footer span { color: var(--gold); opacity: 0.7; }

    /* ── Loading shimmer ── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .loading #answer-text {
      background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface) 50%, var(--surface-2) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
      height: 1em;
      width: 60%;
      color: transparent;
    }

    @media (max-width: 520px) {
      .card { padding: 2rem 1.5rem; }
      .site-title { font-size: 2.1rem; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:#1a1000">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          <path d="M9 9h6M9 13h4"/>
        </svg>
      </div>
      <h1 class="site-title">Ask<span>My</span>Notes</h1>
      <p class="site-sub">Chat with your PDF notes using AI-powered retrieval</p>
    </div>

    <div class="divider"></div>

    <div class="field-group">
      <label for="pdf-input">Upload notes</label>
      <div class="file-drop">
        <input type="file" id="pdf-input" accept=".pdf">
        <div class="file-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="18" x2="12" y2="12"/>
            <line x1="9" y1="15" x2="15" y2="15"/>
          </svg>
        </div>
        <div class="file-info">
          <div class="file-main">Choose a PDF file</div>
          <div class="file-hint">or drag and drop here</div>
        </div>
      </div>
      <div id="upload-status">No file uploaded yet.</div>
    </div>

    <div class="field-group">
      <label for="question">Your question</label>
      <textarea id="question" rows="3" placeholder="What do my notes say about…"></textarea>
      <div class="submit-row">
        <div id="status"></div>
        <button id="ask-btn">Ask →</button>
      </div>
    </div>

    <div class="field-group answer-wrap">
      <label>Answer</label>
      <div class="pills" id="meta">
        <span id="type-pill" class="pill hidden"></span>
        <span id="tool-pill" class="pill hidden"></span>
      </div>
      <div id="answer">
        <div id="answer-text">Your answer will appear here…</div>
      </div>
      <details id="sources-wrap" class="hidden">
        <summary>Sources — top chunks used</summary>
        <ol id="sources"></ol>
      </details>
    </div>
  </div>

  <footer>Built as part of the <span>AI Engineering Bootcamp</span></footer>

  <script>
    const fileInput = document.getElementById('pdf-input');
    const uploadStatus = document.getElementById('upload-status');

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        const name = fileInput.files[0].name;
        uploadStatus.textContent = '✓  ' + name;
        uploadStatus.classList.add('has-file');
      } else {
        uploadStatus.textContent = 'No file uploaded yet.';
        uploadStatus.classList.remove('has-file');
      }
    });

    // Drag visual feedback
    const fileDrop = document.querySelector('.file-drop');
    ['dragenter','dragover'].forEach(e => fileDrop.addEventListener(e, ev => {
      ev.preventDefault(); fileDrop.style.borderColor = 'var(--gold)';
    }));
    ['dragleave','drop'].forEach(e => fileDrop.addEventListener(e, () => {
      fileDrop.style.borderColor = '';
    }));
  </script>
</body>
</html>
